# Netlify Configuration for SvelteKit + @sveltejs/adapter-netlify
[build]
  command = "pnpm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "11.24.0"
  PNPM_FLAGS = "--shamefully-hoist"
  SECRETS_SCAN_OMIT_KEYS = "PUBLIC_BASE_URL,POLAR_PRODUCT_STARTER,POLAR_PRODUCT_GROWTH,POLAR_PRODUCT_SCALE,NODE_VERSION"

# Netlify Serverless Function configuration for Native Rust Modules (Zero-WASM)
[functions]
  node_bundler = "esbuild"
  included_files = ["src/lib/server/assets/fonts/**"]
  external_node_modules = ["@resvg/resvg-js"]

# Performance Edge Caching Headers for Dynamic OG Endpoints
[[headers]]
  for = "/api/og"
  [headers.values]
    Cache-Control = "public, max-age=31536000, s-maxage=31536000, stale-while-revalidate=86400, immutable"
    CDN-Cache-Control = "max-age=31536000"
    Netlify-CDN-Cache-Control = "max-age=31536000"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/sitemap.xsl"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "text/xsl; charset=utf-8"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/manifest+json; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "image/svg+xml; charset=utf-8"

# Favicon.ico Fallback Redirect
[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.svg"
  status = 200


