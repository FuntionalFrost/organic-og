<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="og-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#fdba74" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Shield -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#0c0a09" stroke="#292524" stroke-width="2"/>
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#og-grad)" fill-opacity="0.12"/>
  
  <!-- Outer Card Frame -->
  <rect x="12" y="14" width="40" height="28" rx="6" fill="#1c1917" stroke="url(#og-grad)" stroke-width="2"/>
  
  <!-- Aspect ratio header bar -->
  <line x1="12" y1="21" x2="52" y2="21" stroke="#292524" stroke-width="1.5" />
  <circle cx="17" cy="17.5" r="1.5" fill="#f97316" />
  <circle cx="22" cy="17.5" r="1.5" fill="#78716c" />
  
  <!-- Image mountain / pulse graphics -->
  <path d="M16 36 L24 26 L32 36" stroke="#fb923c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M28 36 L36 29 L46 36" stroke="#ea580c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="39" cy="25" r="2" fill="#fdba74" />
  
  <!-- Edge lightning / spark badge -->
  <g transform="translate(36, 36) scale(0.9)">
    <circle cx="12" cy="12" r="11" fill="#ea580c" filter="url(#glow)"/>
    <circle cx="12" cy="12" r="10" fill="url(#og-grad)" stroke="#fff" stroke-width="1.5"/>
    <path d="M13 5 L8 13 L12 13 L11 19 L17 11 L13 11 Z" fill="#ffffff"/>
  </g>
</svg>
