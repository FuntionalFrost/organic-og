<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="org-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="leaf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Shield Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#09090b" stroke="#27272a" stroke-width="2"/>
  
  <!-- Outer OG Card Frame -->
  <rect x="10" y="12" width="44" height="34" rx="8" fill="#18181b" stroke="url(#org-grad)" stroke-width="2.5"/>
  
  <!-- Ratio Header Line & Dots -->
  <line x1="10" y1="22" x2="54" y2="22" stroke="#27272a" stroke-width="2" />
  <circle cx="16" cy="17" r="2" fill="#f97316" />
  <circle cx="22" cy="17" r="2" fill="#71717a" />
  
  <!-- Organic Sprouting Leaf Core -->
  <path d="M18 40 C 18 28, 30 25, 42 27 C 42 38, 31 41, 18 40 Z" fill="url(#leaf-grad)" />
  <path d="M18 40 C 25 33, 32 31, 40 28" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  
  <!-- Glowing Spark Indicator -->
  <g transform="translate(38, 36)">
    <circle cx="10" cy="10" r="10" fill="#ea580c" filter="url(#glow)"/>
    <circle cx="10" cy="10" r="9" fill="url(#org-grad)" stroke="#ffffff" stroke-width="1.5"/>
    <path d="M11 4 L7 11 L10 11 L9 16 L14 9 L11 9 Z" fill="#ffffff"/>
  </g>
</svg>
